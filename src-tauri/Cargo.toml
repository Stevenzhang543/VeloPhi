[package]
name = "verity"
version = "26.51.0"
description = "Verity: physics simulation and teaching engine with verifiable results"
authors = ["Verity maintainers"]
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
name = "verity_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-dialog = "=2.8.3"
tauri-plugin-fs = "=2.7.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Independent of any surrounding workspace.
[workspace]
resolver = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
incremental = false
strip = "debuginfo"
