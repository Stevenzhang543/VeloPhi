[package]
name = "velophi"
version = "26.55.0"
description = "VeloPhi: physics simulation and teaching engine with verifiable results"
authors = ["VeloPhi maintainers"]
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
name = "velophi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-dialog = "=2.8.3"
tauri-plugin-fs = "=2.7.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
# The physics core, run natively (26.53, D68)
velophi-native = { path = "../engine/velophi-native" }

# Independent of any surrounding workspace.
[workspace]
resolver = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
incremental = false
strip = "debuginfo"
