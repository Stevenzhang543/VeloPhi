[workspace]
members = [
  "nova_core",
  "crates/nova_math",
  "crates/nova_physics",
  "crates/nova_runtime",
  "crates/nova_script",
  "crates/nova_format",
  "crates/nova_rhythm",
  "crates/nova_wasm",
  "crates/nova_headless",
]
exclude = ["src-tauri"]
resolver = "2"

[workspace.package]
version = "26.47.0"
edition = "2021"
rust-version = "1.77"
license = "MIT"
repository = "https://github.com/Stevenzhang543/Nova_A"
authors = ["Whitelist"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
wasm-bindgen = "0.2"
rhai = { version = "1.25.0", default-features = false, features = ["std", "debugging"] }

# 26.20: optimize across crate boundaries without changing panic/recovery semantics.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
incremental = false
strip = "debuginfo"
