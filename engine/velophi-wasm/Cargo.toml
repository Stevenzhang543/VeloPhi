[package]
name = "velophi-wasm"
description = "WebAssembly C ABI of the VeloPhi core (no wasm-bindgen); see engine/ABI.md"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
velophi-core = { path = "../velophi-core" }
serde_json = { version = "1", features = ["float_roundtrip"] }
