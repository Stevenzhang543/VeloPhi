[package]
name = "verity-cli"
description = "Native runner of the Verity core for the parity harness (scripts/parity.mjs) and benchmarks"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "verity-cli"
path = "src/main.rs"

[dependencies]
verity-core = { path = "../verity-core" }
serde_json = { version = "1", features = ["float_roundtrip"] }
