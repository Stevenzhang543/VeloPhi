[package]
name = "velophi-cli"
description = "Native runner of the VeloPhi core for the parity harness (scripts/parity.mjs) and benchmarks"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "velophi-cli"
path = "src/main.rs"

[dependencies]
velophi-core = { path = "../velophi-core" }
serde_json = { version = "1", features = ["float_roundtrip"] }
