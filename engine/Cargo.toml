[workspace]
resolver = "2"
members = ["velophi-core", "velophi-cli", "velophi-wasm", "velophi-native"]
# Test-only Node-API module (built on demand: scripts/build-napi.mjs); not part of the workspace so Windows builds never link it
exclude = ["velophi-napi"]

[workspace.package]
version = "26.55.0"
edition = "2021"
publish = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

# Tests and the dev build run whole simulations: optimise the core even there (no effect on results)
[profile.dev.package.velophi-core]
opt-level = 2

[profile.test.package.velophi-core]
opt-level = 2
